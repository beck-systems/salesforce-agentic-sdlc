<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-label="Hash-locked approval: the operator approves spec.md in the terminal, the orchestrator writes its sha256 to approved.json, and the builder's guard recomputes the hash on every deploy, denying it if the spec changed.">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#18212b}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .muted{fill:#5b6776}
    .or{fill:#ffffff;stroke:#8795a6;stroke-width:1.5}
    .wr{fill:#fdf5ec;stroke:#b45309;stroke-width:1.5}
    .gate{fill:#f1ebfe;stroke:#7c3aed;stroke-width:1.5}
    .ar{stroke:#5b6776;stroke-width:1.6;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6776"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="389" rx="14" fill="#f8fafc" stroke="#d6dde6"/>
  <text x="40" y="44" class="t" font-size="22" font-weight="700">Hash-locked approval</text>
  <text x="40" y="66" class="t muted" font-size="13">A Jira status change can't start a build. Only an approval in the terminal can, and only for the exact spec text that was approved.</text>

  <rect x="40" y="100" width="200" height="80" rx="10" class="or"/>
  <text x="140" y="134" class="t m" font-size="15" font-weight="700" text-anchor="middle">spec.md</text>
  <text x="140" y="156" class="t muted" font-size="12" text-anchor="middle">written by the orchestrator</text>
  <text x="40" y="204" class="t" font-size="12" fill="#b42318">edit it after approval → hash mismatch</text>

  <line x1="240" y1="140" x2="318" y2="140" class="ar" marker-end="url(#a)"/>
  <text x="279" y="130" class="t muted" font-size="11.5" text-anchor="middle">⏸ review</text>

  <rect x="320" y="100" width="220" height="80" rx="10" class="gate"/>
  <text x="430" y="134" class="t" font-size="15" font-weight="700" text-anchor="middle" fill="#5b21b6">Operator: "approved"</text>
  <text x="430" y="156" class="t muted" font-size="12" text-anchor="middle">typed in the terminal</text>

  <line x1="540" y1="140" x2="618" y2="140" class="ar" marker-end="url(#a)"/>
  <text x="579" y="130" class="t muted" font-size="11.5" text-anchor="middle">sha256</text>

  <rect x="620" y="100" width="280" height="80" rx="10" class="or"/>
  <text x="760" y="132" class="t m" font-size="15" font-weight="700" text-anchor="middle">approved.json</text>
  <text x="760" y="152" class="t m muted" font-size="11.5" text-anchor="middle">sha256: 830e…</text>
  <text x="760" y="168" class="t m muted" font-size="11.5" text-anchor="middle">approved_by: terminal</text>
  <text x="920" y="132" class="t muted" font-size="12">Only the orchestrator writes it.</text>
  <text x="920" y="150" class="t muted" font-size="12">Every agent hook denies a write</text>
  <text x="920" y="168" class="t muted" font-size="12">to approved.json.</text>

  <rect x="40" y="250" width="240" height="80" rx="10" class="wr"/>
  <text x="160" y="282" class="t m" font-size="15" font-weight="700" text-anchor="middle" fill="#8f3f07">sf-builder</text>
  <text x="160" y="304" class="t m muted" font-size="11" text-anchor="middle">sf project deploy start -o dev</text>

  <line x1="280" y1="290" x2="358" y2="290" class="ar" marker-end="url(#a)"/>
  <text x="319" y="280" class="t muted" font-size="11.5" text-anchor="middle">PreToolUse</text>

  <rect x="360" y="240" width="340" height="100" rx="10" fill="#ffffff" stroke="#18212b" stroke-width="1.8"/>
  <text x="530" y="270" class="t m" font-size="14" font-weight="700" text-anchor="middle">sf-builder-guard.py</text>
  <text x="530" y="294" class="t m" font-size="11.5" text-anchor="middle">sha256(spec.md) == approved.sha256 ?</text>
  <text x="530" y="316" class="t muted" font-size="12" text-anchor="middle">org from -o: build · qa · anything else = Prod</text>

  <path d="M760 180 C760 210 600 210 560 238" class="ar" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="690" y="222" class="t muted" font-size="11.5">read on every deploy</text>

  <rect x="800" y="236" width="360" height="36" rx="8" fill="#e3f4ea" stroke="#157a43"/>
  <text x="816" y="259" class="t" font-size="12.5" fill="#0f5c32"><tspan font-weight="700">ALLOW</tspan>  match + build org → deploy runs</text>
  <rect x="800" y="278" width="360" height="36" rx="8" fill="#f1ebfe" stroke="#7c3aed"/>
  <text x="816" y="301" class="t" font-size="12.5" fill="#5b21b6"><tspan font-weight="700">ASK</tspan>  match + QA org → operator confirms</text>
  <rect x="800" y="320" width="360" height="36" rx="8" fill="#fde8e6" stroke="#b42318"/>
  <text x="816" y="343" class="t" font-size="12.5" fill="#8f1c13"><tspan font-weight="700">DENY</tspan>  missing, changed, no -o, or Prod</text>
  <line x1="700" y1="280" x2="798" y2="254" class="ar" marker-end="url(#a)"/>
  <line x1="700" y1="290" x2="798" y2="296" class="ar" marker-end="url(#a)"/>
  <line x1="700" y1="300" x2="798" y2="338" class="ar" marker-end="url(#a)"/>
</svg>
