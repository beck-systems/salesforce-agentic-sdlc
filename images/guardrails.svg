<text x="40" y="460" class="t muted" font-size="12.5">* Real deploys and data writes read approved.json: its sha256 must still match spec.md, or the hook denies the call.</text>
<text x="40" y="482" class="t muted" font-size="12.5">Org aliases come from config.json. An alias or username that matches neither the build nor the QA pattern is treated as Prod, so a typo fails safe.</text>
<text x="40" y="504" class="t muted" font-size="12.5">Read-only agents' reads are never auto-approved; they defer to your normal permission rules.</text>
