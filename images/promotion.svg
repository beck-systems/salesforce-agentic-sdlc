<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img" aria-label="Promotion path: build org, integration, QA org, production, moved by Gearset pull requests, with an operator gate at every step.">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#18212b}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .muted{fill:#5b6776}
    .ar{stroke:#5b6776;stroke-width:1.6;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6776"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="289" rx="14" fill="#f8fafc" stroke="#d6dde6"/>
  <text x="40" y="44" class="t" font-size="22" font-weight="700">Promotion path</text>
  <text x="40" y="66" class="t muted" font-size="13">One branch, four orgs. New automation deploys inactive and is switched on only after QA passes.</text>

  <rect x="40" y="96" width="240" height="64" rx="10" fill="#fdf5ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="160" y="124" class="t" font-size="15" font-weight="700" text-anchor="middle">Build org</text>
  <text x="160" y="144" class="t m muted" font-size="12" text-anchor="middle">dev</text>
  <rect x="330" y="96" width="240" height="64" rx="10" fill="#ffffff" stroke="#8795a6" stroke-width="1.5"/>
  <text x="450" y="124" class="t" font-size="15" font-weight="700" text-anchor="middle">Integration</text>
  <text x="450" y="144" class="t m muted" font-size="12" text-anchor="middle">first Gearset stage</text>
  <rect x="620" y="96" width="240" height="64" rx="10" fill="#ffffff" stroke="#8795a6" stroke-width="1.5"/>
  <text x="740" y="124" class="t" font-size="15" font-weight="700" text-anchor="middle">QA org</text>
  <text x="740" y="144" class="t m muted" font-size="12" text-anchor="middle">qa</text>
  <rect x="910" y="96" width="250" height="64" rx="10" fill="#ffffff" stroke="#18212b" stroke-width="1.8"/>
  <text x="1035" y="124" class="t" font-size="15" font-weight="700" text-anchor="middle">Production</text>
  <text x="1035" y="144" class="t m muted" font-size="12" text-anchor="middle">prod</text>

  <line x1="280" y1="128" x2="328" y2="128" class="ar" marker-end="url(#a)"/>
  <text x="304" y="118" class="t" font-size="11" fill="#6d28d9" text-anchor="middle">⏸ PR</text>
  <line x1="570" y1="128" x2="618" y2="128" class="ar" marker-end="url(#a)"/>
  <text x="594" y="118" class="t" font-size="11" fill="#6d28d9" text-anchor="middle">⏸</text>
  <line x1="860" y1="128" x2="908" y2="128" class="ar" marker-end="url(#a)"/>
  <text x="884" y="118" class="t" font-size="11" fill="#6d28d9" text-anchor="middle">⏸ go</text>

  <text x="40" y="196" class="t" font-size="12.5">sf-builder: dry-run, then deploy</text>
  <text x="40" y="216" class="t muted" font-size="12.5">new VRs and flows inactive</text>
  <text x="40" y="236" class="t muted" font-size="12.5">sf-qa runs build-mode tests</text>
  <text x="330" y="196" class="t" font-size="12.5">Branch pushed, Gearset PR opened</text>
  <text x="330" y="216" class="t muted" font-size="12.5">code review per the team's process</text>
  <text x="330" y="236" class="t muted" font-size="12.5">Jira → testing (proposed, gated)</text>
  <text x="620" y="196" class="t" font-size="12.5">sf-qa runs qa-mode tests</text>
  <text x="620" y="216" class="t muted" font-size="12.5">every QA-org write asks</text>
  <text x="620" y="236" class="t muted" font-size="12.5">results appended to qa.md</text>
  <text x="910" y="196" class="t" font-size="12.5">Explicit go-ahead in the terminal</text>
  <text x="910" y="216" class="t muted" font-size="12.5">Post Deployment Steps walked together</text>
  <text x="910" y="236" class="t muted" font-size="12.5">verified on a Test - &lt;KEY&gt; record</text>
</svg>
